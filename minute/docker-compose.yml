services:
  minute:
    build: .
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    env_file: .env
    environment:
      NODE_ENV: production
      MINUTE_DATA_DIR: /app/.data
    ports:
      - "8787:8787"
    volumes:
      - minute-data:/app/.data
      - ./minute.config.yaml:/app/minute.config.yaml:ro
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  minute-data:
